[package]
name = "nibble-app"
description = "The nibble menu bar app: wires adapters to core and renders the tray and popover."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nibble"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nibble-core.workspace = true
nibble-adapters = { path = "../nibble-adapters" }
chrono = { workspace = true, features = ["clock", "serde"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[lints]
workspace = true
