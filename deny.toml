# cargo-deny: dependency licenses, security advisories, duplicate crates.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail at any depth. "Unmaintained" only fails for our direct dependencies:
# Tauri's Linux stack (zbus/zvariant via notifications, proc-macro-error via GTK) is out of
# our hands and gets updated with Tauri.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses only. nibble must stay free of GPL-family dependencies.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

# Mozilla's root certificates, which the updater uses to reach GitHub over HTTPS. CDLA-Permissive
# is a permissive license for data, so it is allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
