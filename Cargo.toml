[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
nibble-core = { path = "crates/nibble-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Groups first (lower priority), then individual overrides.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# No crashing in production paths: errors flow through Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"

# No debugging leftovers.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Suppressions must be #[expect(..., reason = "...")] so they are justified and go stale loudly.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Exhaustiveness and clarity.
wildcard_enum_match_arm = "warn"
shadow_unrelated = "warn"
as_conversions = "warn"
float_cmp = "deny"
