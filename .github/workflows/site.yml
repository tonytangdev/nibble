name: site
# Deploys the landing page to Cloudflare Workers (nibble.tonytang.dev) when something the
# page is built from changes on main, and when a release is published, as the page lists the
# latest release's files. `wrangler.jsonc` holds the Worker's settings.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - design/**
      - crates/nibble-app/icons/**
      - wrangler.jsonc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  release:
    types: [published]
  workflow_dispatch:

# Deploys run one at a time, and a newer push replaces one still waiting.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx --yes wrangler@4.160.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
