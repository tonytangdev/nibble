# A manual, unsigned macOS build, kept as a workflow artifact and never released.
# Use it to try the packaging before the signing secrets exist: Actions → build → Run workflow.
# An unsigned download is blocked by Gatekeeper; open it with `xattr -cr /Applications/nibble.app`.
name: build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add both Mac architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm exec tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: nibble-macos-universal-unsigned
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
