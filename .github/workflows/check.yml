name: check
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds, on macOS only: it ships
  # only macOS, so an outage on another platform's runners must not block a release.
  workflow_call:
    inputs:
      macos-only:
        type: boolean
        default: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos-only && '["macos-latest"]' || '["macos-latest", "windows-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    # A normal run takes under 5 minutes; a stuck runner fails here instead of hanging for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        # When Ubuntu's package mirrors are unreachable, apt retries for an hour; fail fast.
        # Pinned to 24.04: on 26.04 apt fetches amd64v3 builds from a mirror that stalls.
        # Recommended packages (gstreamer plugins, pipewire, portals) are not needed to build.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm site:build

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
