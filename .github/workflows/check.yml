name: check
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds, on macOS only: it ships
  # only macOS, so an outage on another platform's runners must not block a release.
  workflow_call:
    inputs:
      macos-only:
        type: boolean
        default: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs in a Debian container: its apt reads deb.debian.org, so the job does not
        # depend on the Ubuntu mirrors GitHub's runners use, which go unreachable for hours.
        include: ${{ fromJSON(inputs.macos-only && '[{"os":"macos-latest"}]' || '[{"os":"macos-latest"},{"os":"windows-latest"},{"os":"ubuntu-latest","container":"rust:1-trixie"}]') }}
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # A normal run takes under 5 minutes; a stuck runner fails here instead of hanging for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        # When the package mirrors are unreachable, apt retries for an hour; fail fast.
        # Recommended packages (gstreamer plugins, pipewire, portals) are not needed to build.
        timeout-minutes: 5
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm site:build

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
