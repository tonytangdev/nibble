# Checks every push to main and every pull request. A change runs the checks of whichever
# side it touches: the app (`app-checks.yml`), the website (`pnpm site:check`) or both, as
# the shared inputs (package.json, the lockfile, design/, the app's icons, the TypeScript and
# ESLint settings) trigger both. Formatting covers the whole repository and always runs.
#
# The `check` job always runs and fails if any check failed, so it is the one status to
# require on main: skipped checks never leave a pull request waiting.
name: check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A newer push to the same branch or pull request makes the run in progress stale, so it is cancelled.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      # A pull request is compared with its base, a push to main with the commit before it.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - eslint.config.js
              - design/**
              - .github/workflows/check.yml
            app:
              - *shared
              - crates/**
              - ui/**
              - Cargo.toml
              - Cargo.lock
              - clippy.toml
              - rustfmt.toml
              - rust-toolchain.toml
              - deny.toml
              - .github/workflows/app-checks.yml
            site:
              - *shared
              - site/**
              - crates/nibble-app/icons/**
              - wrangler.jsonc
              - .github/workflows/site.yml

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app-checks.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build lists the latest release's files; the token keeps it clear of the API's rate limit.
      - run: pnpm site:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check:
    needs: [changes, format, app, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, format, app, site: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A check did not pass ($result)."; exit 1 ;;
            esac
          done
